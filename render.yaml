# Blueprint do Render: cria o Web Service + o PostgreSQL de uma vez.
# No painel: New + -> Blueprint -> selecionar este repositório.
#
# IMPORTANTE (o que voce precisa fazer na hora de criar):
#   1. O plano padrao do Web Service aparece como Standard (US$ 25/mes).
#      Troque para "Starter" (US$ 7/mes, 512 MB RAM, 0.5 CPU) na lista de
#      Instance Types. E o suficiente para o app (a IA roda na Anthropic).
#   2. Preencha as variaveis de ambiente marcadas como `sync: false` abaixo
#      (elas nao vao para o Git).
#   3. O DATABASE_URL e injetado automaticamente ao ligar o banco `mentor-db`.
services:
  - type: web
    name: mentor-carreira
    runtime: docker
    plan: starter          # US$7/mes. NAO usar 'free': hiberna apos 15min (cold start ~1min).
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Injetado automaticamente pelo Render ao ligar o banco abaixo.
      - key: DATABASE_URL
        fromDatabase:
          name: mentor-db
          property: connectionString
      - key: APP_ENV
        value: production
      # sync: false = voce preenche no painel; NAO fica versionado no Git.
      - key: SECRET_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: INVITE_CODE
        sync: false

databases:
  - name: mentor-db
    plan: free             # Postgres Free do Render: ~30 dias de validade.
    region: oregon         # Exporte os dados ANTES de expirar (te passo o comando).
    postgresMajorVersion: "16"
