{% extends "base.html" %}

{% block titulo %}Entrar{% endblock %}

{% block conteudo %}
<div class="auth-card">
    <div class="pagina-header">
        <h1>Entrar</h1>
    </div>

    {% if erro %}
        <p class="erro" role="alert">{{ erro }}</p>
    {% endif %}

    <div class="form-cartao">
        <form method="post" action="/login">
            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" value="{{ email or '' }}"
                       placeholder="seu@email.com" autocomplete="email" required>
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <div class="campo-senha">
                    <input type="password" id="senha" name="senha" autocomplete="current-password" required>
                    <button type="button" class="toggle-senha" data-target="senha"
                            aria-pressed="false" aria-label="Mostrar senha">Mostrar</button>
                </div>
            </div>

            <div style="padding-top:0.25rem;">
                <button type="submit">Entrar</button>
            </div>
        </form>
        <p class="texto-muted" style="margin-top:1rem; margin-bottom:0;">
            Ainda não tem conta? <a href="/alunos/novo">Cadastre-se</a>
        </p>
    </div>
</div>
{% endblock %}
